name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        run: |
          cat > config.js << CONFIGEOF
          window.FIREBASE_CONFIG = {
            apiKey:            "${{ secrets.FIREBASE_API_KEY }}",
            authDomain:        "links-e3553.firebaseapp.com",
            projectId:         "links-e3553",
            storageBucket:     "links-e3553.firebasestorage.app",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_ID }}",
            appId:             "${{ secrets.FIREBASE_APP_ID }}",
            measurementId:     "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          window.ADMIN_EMAIL = "${{ secrets.ADMIN_EMAIL }}";
          CONFIGEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
