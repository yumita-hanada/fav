<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>startpage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap');

  :root {
    --bg: #0a0a0a;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.1);
    --card-hover: rgba(255,255,255,0.12);
    --text: rgba(255,255,255,0.88);
    --text-muted: rgba(255,255,255,0.4);
    --accent: #c8ff00;
    --accent-dim: rgba(200,255,0,0.15);
    --gap: 20px;
    --card-w: 90px;
    --card-h: 96px;
    --radius: 14px;
    --font: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    /* select styling fix */
    --select-bg: #1e1e1e;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:var(--font); background:var(--bg); color:var(--text); user-select:none; }

  .link-card { text-decoration: none; }

  /* ── SPLASH ─────────────────────────────────────── */
  #splash { position:fixed; inset:0; z-index:9999; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .4s; }
  #splash.hidden { opacity:0; pointer-events:none; }
  .splash-logo { font-size:30px; font-family:var(--font-mono); color:var(--accent); }
  .splash-status { font-size:11px; color:var(--text-muted); letter-spacing:.1em; text-transform:uppercase; }
  .spinner { width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,.08); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── TOAST ──────────────────────────────────────── */
  #toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:9000; background:rgba(20,20,20,.95); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 20px; font-size:12px; color:var(--text-muted); backdrop-filter:blur(12px); opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
  #toast.show    { opacity:1; }
  #toast.success { border-color:var(--accent); color:var(--accent); }
  #toast.error   { border-color:#ff6060; color:#ff6060; }

  /* ── SYNC DOT ───────────────────────────────────── */
  #sync-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.6; transition:background .3s; flex-shrink:0; }
  #sync-dot.syncing { background:#ffaa00; animation:pulse .8s infinite; }
  #sync-dot.error   { background:#ff6060; animation:none; opacity:1; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* ── BACKGROUND ─────────────────────────────────── */
  #bg-layer { position:fixed; inset:0; z-index:0; background:var(--bg); transition:background .4s; }
  #bg-layer.has-image { background-size:cover!important; background-position:center!important; background-repeat:no-repeat!important; }
  #bg-overlay { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,.35); pointer-events:none; opacity:0; transition:opacity .4s; }
  #bg-layer.has-image ~ #bg-overlay { opacity:1; }

  /* ── LAYOUT ─────────────────────────────────────── */
  #app { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; }

  /* ── TOPBAR ─────────────────────────────────────── */
  #topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 24px 0; flex-shrink:0; }
  /* extra top padding so the delete badge isn't clipped */
  #label-bar { display:flex; gap:8px; flex-wrap:nowrap; overflow:hidden; align-items:center; padding-top:8px; }

  .label-chip {
    padding:5px 13px; border-radius:99px; font-size:12px; font-weight:500;
    cursor:pointer; border:1px solid var(--card-border); background:var(--card-bg);
    color:var(--text-muted); backdrop-filter:blur(8px); transition:all .18s;
    white-space:nowrap; position:relative;
    /* ensure badge is visible above sibling chips */
    overflow:visible;
  }
  .label-chip:hover { color:var(--text); border-color:rgba(255,255,255,.25); }
  .label-chip.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  /* delete badge – fixed clipping */
  .label-chip .lbl-del {
    display:none; position:absolute; top:-7px; right:-7px;
    width:16px; height:16px; border-radius:50%;
    background:#ff4444; color:#fff; font-size:10px; line-height:1;
    align-items:center; justify-content:center; cursor:pointer;
    border:2px solid #0a0a0a;
    z-index:10;
  }
  .label-chip:hover .lbl-del { display:flex; }
  #lbl-add-btn { padding:5px 11px; border-radius:99px; font-size:12px; font-family:var(--font-mono); cursor:pointer; border:1px dashed var(--card-border); background:transparent; color:var(--text-muted); transition:all .18s; }
  #lbl-add-btn:hover { border-color:var(--accent); color:var(--accent); }
  #topbar-right { display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .icon-btn { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--card-border); background:var(--card-bg); backdrop-filter:blur(8px); color:var(--text-muted); transition:all .18s; font-size:16px; }
  .icon-btn:hover { color:var(--text); border-color:rgba(255,255,255,.25); }

  /* ── PAGES ──────────────────────────────────────── */
  #pages-container { flex:1; overflow:hidden; position:relative; }
  .page { position:absolute; inset:0; display:none; padding:var(--gap); align-content:start; gap:var(--gap); flex-wrap:wrap; opacity:0; transition:opacity .25s; }
  .page.active { display:flex; opacity:1; }

  /* ── LINK CARD ──────────────────────────────────── */
  .link-card { width:var(--card-w); height:var(--card-h); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:8px; cursor:pointer; position:relative; flex-shrink:0; transition:transform .15s; }
  .link-card .icon-wrap { width:60px; height:60px; border-radius:var(--radius); background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; overflow:hidden; transition:transform .18s, box-shadow .18s, border-color .18s, background .18s; }
  .link-card:hover .icon-wrap { transform:translateY(-3px) scale(1.04); box-shadow:0 8px 24px rgba(0,0,0,.4); background:var(--card-hover); border-color:rgba(255,255,255,.22); }
  .link-card .icon-wrap img { width:32px; height:32px; object-fit:contain; border-radius:4px; }
  .link-card .icon-wrap .fallback-icon { font-size:26px; font-weight:600; color:var(--text); font-family:var(--font-mono); }
  .link-card .card-name { font-size:11px; color:var(--text-muted); text-align:center; line-height:1.3; max-width:var(--card-w); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .18s; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .link-card:hover .card-name { color:var(--text); }

  /* Drag states */
  .link-card.dragging { opacity:.25; }
  /* Gap preview: a glowing slot appears before the hovered card */
  .link-card.drag-before::before {
    content:''; position:absolute; left:calc(-1 * var(--gap) / 2 - 1px); top:0;
    width:3px; height:100%; border-radius:2px;
    background:var(--accent); box-shadow:0 0 8px var(--accent);
    animation:slotPulse .6s ease infinite;
  }
  .link-card.drag-after::after {
    content:''; position:absolute; right:calc(-1 * var(--gap) / 2 - 1px); top:0;
    width:3px; height:100%; border-radius:2px;
    background:var(--accent); box-shadow:0 0 8px var(--accent);
    animation:slotPulse .6s ease infinite;
  }
  @keyframes slotPulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* ── ADD CARD ───────────────────────────────────── */
  .add-card { width:var(--card-w); height:var(--card-h); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:8px; cursor:pointer; flex-shrink:0; opacity:.35; transition:opacity .18s; }
  .add-card:hover { opacity:.75; }
  .add-card .icon-wrap { width:60px; height:60px; border-radius:var(--radius); border:1.5px dashed var(--card-border); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--text-muted); transition:border-color .18s, color .18s; }
  .add-card:hover .icon-wrap { border-color:var(--accent); color:var(--accent); }
  .add-card .card-name { font-size:11px; color:var(--text-muted); text-shadow:0 1px 4px rgba(0,0,0,.6); }

  /* ── PAGE DOTS ──────────────────────────────────── */
  #page-dots { display:flex; justify-content:center; gap:8px; padding:10px 0 14px; flex-shrink:0; }
  .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.2); cursor:pointer; transition:all .18s; }
  .dot.active { background:var(--accent); transform:scale(1.3); }

  /* ── CONTEXT MENU ───────────────────────────────── */
  #ctx-menu { position:fixed; z-index:999; background:rgba(20,20,20,.96); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:6px; min-width:150px; box-shadow:0 12px 40px rgba(0,0,0,.6); display:none; flex-direction:column; gap:2px; font-size:13px; }
  #ctx-menu.show { display:flex; }
  .ctx-item { padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--text-muted); transition:all .12s; display:flex; align-items:center; gap:8px; }
  .ctx-item:hover { background:rgba(255,255,255,.08); color:var(--text); }
  .ctx-item.danger:hover { background:rgba(255,60,60,.15); color:#ff6060; }

  /* ── MODAL ──────────────────────────────────────── */
  #modal-overlay { position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; }
  #modal-overlay.show { display:flex; }
  #modal { background:rgba(18,18,18,.98); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:28px; min-width:360px; max-width:440px; box-shadow:0 24px 60px rgba(0,0,0,.7); display:flex; flex-direction:column; gap:16px; }
  #modal h2 { font-size:16px; font-weight:500; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:11px; color:var(--text-muted); letter-spacing:.08em; text-transform:uppercase; }
  .field input { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:10px 14px; color:var(--text); font-family:var(--font); font-size:13px; outline:none; transition:border-color .15s; }
  .field input:focus { border-color:var(--accent); }
  .tag-chips-edit { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .tchip { padding:4px 10px; border-radius:99px; font-size:11px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:var(--text-muted); cursor:pointer; transition:all .15s; }
  .tchip.sel { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .modal-btns { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
  .btn { padding:9px 20px; border-radius:10px; font-family:var(--font); font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; }
  .btn-ghost { background:transparent; border:1px solid rgba(255,255,255,.1); color:var(--text-muted); }
  .btn-ghost:hover { background:rgba(255,255,255,.06); color:var(--text); }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-primary:hover { filter:brightness(1.1); }

  /* ── SETTINGS ───────────────────────────────────── */
  #settings-panel { position:fixed; inset:0; z-index:800; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); }
  #settings-panel.show { display:flex; }
  #settings-box { background:rgba(16,16,16,.98); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:30px; width:480px; box-shadow:0 24px 60px rgba(0,0,0,.7); display:flex; flex-direction:column; gap:22px; max-height:85vh; overflow-y:auto; }
  #settings-box h2 { font-size:17px; font-weight:500; }
  .settings-section { display:flex; flex-direction:column; gap:12px; }
  .settings-section h3 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
  .bg-options { display:flex; gap:10px; flex-wrap:wrap; }
  .bg-opt { padding:8px 16px; border-radius:10px; font-size:12px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); color:var(--text-muted); cursor:pointer; transition:all .15s; }
  .bg-opt:hover { border-color:rgba(255,255,255,.25); color:var(--text); }
  .bg-opt.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .color-row { display:flex; gap:10px; align-items:center; }
  .color-row input[type=color] { width:40px; height:36px; border:none; border-radius:8px; background:none; cursor:pointer; padding:2px; }
  .color-row label { font-size:12px; color:var(--text-muted); }
  .gradient-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .img-url-row { display:flex; gap:8px; align-items:center; }
  .img-url-row input { flex:1; }
  .grid-row { display:flex; gap:12px; align-items:center; }
  .grid-row label { font-size:12px; color:var(--text-muted); min-width:80px; }
  .grid-row input[type=range] { flex:1; accent-color:var(--accent); }
  .grid-row .val { font-family:var(--font-mono); font-size:12px; color:var(--accent); min-width:36px; }
  #random-images-list { display:flex; flex-direction:column; gap:8px; }
  .rand-img-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); background:rgba(255,255,255,.04); border-radius:8px; padding:8px 12px; }
  .rand-img-item span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rand-img-item button { background:none; border:none; color:#ff6060; cursor:pointer; font-size:14px; padding:0 4px; }
  .firebase-info { background:rgba(255,170,0,.08); border:1px solid rgba(255,170,0,.25); border-radius:10px; padding:12px 14px; font-size:12px; color:rgba(255,170,0,.85); line-height:1.7; }
  .firebase-info code { font-family:var(--font-mono); background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; font-size:11px; }

  /* ── SHARED INPUT/SELECT STYLE ──────────────────── */
  /* Used in both modal and settings – dark background, light text */
  .s-input {
    background: var(--select-bg);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
    -webkit-appearance: none;
    appearance: none;
  }
  .s-input:focus { border-color: var(--accent); }
  /* Native <select> options inherit color correctly this way */
  select.s-input option { background: var(--select-bg); color: var(--text); }

  #settings-box::-webkit-scrollbar { width:4px; }
  #settings-box::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:4px; }
  
  /* Tag bar toggle */
  #label-bar { transition: max-height .3s ease, opacity .3s ease, padding .3s ease; max-height: 60px; overflow: visible; }
  #label-bar.hidden { max-height: 0; opacity: 0; pointer-events: none; padding-top: 0; }

  /* Toggle button active state */
  #btn-toggle-tags.active { color: var(--text); border-color: rgba(255,255,255,.25); }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">⬡ startpage</div>
  <div class="spinner"></div>
  <div class="splash-status" id="splash-status">Connecting to Firebase…</div>
</div>

<div id="bg-layer"></div>
<div id="bg-overlay"></div>

<div id="app">
  <div id="topbar">
    <div id="label-bar">
      <div class="label-chip active" data-label="all">All</div>
      <button id="lbl-add-btn">+ tag</button>
    </div>
    <div id="topbar-right">
      <div id="sync-dot" title="Firebase sync"></div>
      <div class="icon-btn" id="btn-toggle-tags" title="Toggle tags">⊟</div>
      <div class="icon-btn" id="btn-add-link" title="Add link">＋</div>
      <div class="icon-btn" id="btn-settings" title="Settings">⚙</div>
    </div>
  </div>
  <div id="pages-container"></div>
  <div id="page-dots"></div>
</div>

<!-- Context menu: Edit + Delete only -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">✏️ Edit</div>
  <div class="ctx-item danger" id="ctx-delete">🗑 Delete</div>
</div>

<!-- Add / Edit modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Add link</h2>
    <!-- Name first, then URL -->
    <div class="field"><label>Name</label><input type="text" id="m-name" placeholder="My site"></div>
    <div class="field"><label>URL</label><input type="url" id="m-url" placeholder="https://…"></div>
    <div class="field"><label>Icon (image URL, emoji, or leave empty for auto)</label><input type="text" id="m-icon" placeholder="auto"></div>
    <div class="field"><label>Tags</label><div class="tag-chips-edit" id="m-tags"></div></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-save">Save</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div id="settings-panel">
  <div id="settings-box">
    <h2>⚙ Settings</h2>

    <div class="settings-section">
      <h3>Firebase</h3>
      <div class="firebase-info">
        🔥 Connected anonymously<br>
        User ID: <code id="firebase-uid-display">…</code><br>
        <span style="opacity:.7;font-size:11px;">Your data is private and tied to this browser.</span>
      </div>
    </div>

    <div class="settings-section">
      <h3>Wallpaper</h3>
      <div class="bg-options">
        <div class="bg-opt active" data-bg="solid">Solid color</div>
        <div class="bg-opt" data-bg="gradient">Gradient</div>
        <div class="bg-opt" data-bg="image">Fixed image</div>
        <div class="bg-opt" data-bg="random">Random images</div>
      </div>

      <div id="bg-solid-opts">
        <div class="color-row"><input type="color" id="bg-color" value="#0a0a0a"><label>Background color</label></div>
      </div>

      <div id="bg-gradient-opts" style="display:none">
        <div class="gradient-row">
          <input type="color" id="grad-c1" value="#0a0a0a" style="width:40px;height:36px;border:none;border-radius:8px;cursor:pointer;">
          <input type="color" id="grad-c2" value="#1a1a2e" style="width:40px;height:36px;border:none;border-radius:8px;cursor:pointer;">
          <select id="grad-dir" class="s-input" style="flex:1;">
            <option value="to bottom right">↘ Diagonal</option>
            <option value="to right">→ Horizontal</option>
            <option value="to bottom">↓ Vertical</option>
            <option value="135deg">↗ Diagonal 2</option>
            <option value="radial">◎ Radial</option>
          </select>
        </div>
      </div>

      <div id="bg-image-opts" style="display:none">
        <div class="img-url-row">
          <input type="url" id="bg-img-url" placeholder="https://… or local path" class="s-input" style="flex:1;">
          <button class="btn btn-ghost" id="bg-img-apply" style="white-space:nowrap;padding:9px 14px;font-size:12px;">Apply</button>
        </div>
      </div>

      <div id="bg-random-opts" style="display:none">
        <div class="img-url-row">
          <input type="url" id="rand-img-url" placeholder="Image URL…" class="s-input" style="flex:1;">
          <button class="btn btn-ghost" id="rand-img-add" style="white-space:nowrap;padding:9px 14px;font-size:12px;">+ Add</button>
        </div>
        <div id="random-images-list" style="margin-top:8px;"></div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;">Change every</span>
          <select id="rand-interval" class="s-input">
            <option value="0">On reload only</option>
            <option value="30">30 seconds</option>
            <option value="60">1 minute</option>
            <option value="300">5 minutes</option>
            <option value="600">10 minutes</option>
          </select>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Grid</h3>
      <div class="grid-row"><label>Card width</label><input type="range" id="s-card-w" min="60" max="140" value="90"><span class="val" id="s-card-w-val">90px</span></div>
      <div class="grid-row"><label>Card height</label><input type="range" id="s-card-h" min="70" max="160" value="96"><span class="val" id="s-card-h-val">96px</span></div>
      <div class="grid-row"><label>Gap</label><input type="range" id="s-gap" min="8" max="48" value="20"><span class="val" id="s-gap-val">20px</span></div>
    </div>

    <div class="settings-section">
      <h3>Accent color</h3>
      <div class="color-row"><input type="color" id="accent-color" value="#c8ff00"><label>Highlight color</label></div>
    </div>

    <div class="modal-btns">
      <button class="btn btn-ghost" id="s-close">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

     FIREBASE  (ES module, CDN v10)
════════════════════════════════════════════ -->
<script src="config.js"></script>
<script type="module">
const firebaseConfig = window.FIREBASE_CONFIG;

import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider,
         signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc,
         collection, getDocs, onSnapshot, writeBatch, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Helpers ───────────────────────────────────────────────────────
function uid()       { return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function isEmoji(s)  { return /\p{Emoji}/u.test((s||'').trim()); }
function faviconUrl(url) {
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; }
  catch { return ''; }
}
function hexToRgba(hex,a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function setSyncDot(s) { document.getElementById('sync-dot').className = s==='ok'?'':s; }
function showToast(msg,type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2800);
}

// ── Data ──────────────────────────────────────────────────────────
const DEFAULT_LINKS=[
  {url:'https://google.com',    name:'Google',    icon:'',labels:['search'],       order:0},
  {url:'https://github.com',    name:'GitHub',    icon:'',labels:['dev'],          order:1},
  {url:'https://youtube.com',   name:'YouTube',   icon:'',labels:['media'],        order:2},
  {url:'https://notion.so',     name:'Notion',    icon:'',labels:['work'],         order:3},
  {url:'https://twitter.com',   name:'X/Twitter', icon:'',labels:['social'],       order:4},
  {url:'https://reddit.com',    name:'Reddit',    icon:'',labels:['social'],       order:5},
  {url:'https://figma.com',     name:'Figma',     icon:'',labels:['design','dev'], order:6},
  {url:'https://anthropic.com', name:'Anthropic', icon:'',labels:['ai'],           order:7},
].map(l=>({...l,id:uid()}));

const DEFAULT_META={
  labels:['search','dev','media','work','social','design','ai'],
  settings:{bgType:'solid',bgColor:'#0a0a0a',gradC1:'#0a0a0a',gradC2:'#1a1a2e',
    gradDir:'to bottom right',bgImgUrl:'',randomImages:[],randInterval:0,
    cardW:90,cardH:96,gap:20,accent:'#c8ff00'}
};

let DATA={links:[],labels:[...DEFAULT_META.labels],settings:{...DEFAULT_META.settings}};
let userId=null, saveTimer=null, realtimeUnsubs=[];

const userRef  = ()   => doc(db,'users',userId);
const linksRef = ()   => collection(db,'users',userId,'links');
const linkRef  = (id) => doc(db,'users',userId,'links',id);

// ── Firebase load ─────────────────────────────────────────────────
async function loadData() {
  setSyncDot('syncing');
  try {
    const snap=await getDoc(userRef());
    if(snap.exists()){
      const d=snap.data();
      DATA.labels=d.labels||DEFAULT_META.labels;
      DATA.settings={...DEFAULT_META.settings,...(d.settings||{})};
    } else {
      await setDoc(userRef(),{labels:DATA.labels,settings:DATA.settings});
    }
    const lSnap=await getDocs(linksRef());
    if(lSnap.empty){
      const batch=writeBatch(db);
      DEFAULT_LINKS.forEach(l=>batch.set(linkRef(l.id),l));
      await batch.commit();
      DATA.links=[...DEFAULT_LINKS];
    } else {
      DATA.links=[];
      lSnap.forEach(d=>DATA.links.push(d.data()));
      DATA.links.sort((a,b)=>(a.order||0)-(b.order||0));
    }
    setSyncDot('ok');
  } catch(e){ console.error(e); setSyncDot('error'); showToast('Firebase error — check your config','error'); }
}

// ── Firebase save (debounced) ─────────────────────────────────────
function scheduleSave(){
  setSyncDot('syncing');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try {
      await setDoc(userRef(),{labels:DATA.labels,settings:DATA.settings});
      const batch=writeBatch(db);
      DATA.links.forEach((l,i)=>batch.set(linkRef(l.id),{...l,order:i}));
      await batch.commit();
      setSyncDot('ok');
    } catch(e){ console.error(e); setSyncDot('error'); showToast('Save error','error'); }
  },900);
}
async function removeLink(id){
  try { await deleteDoc(linkRef(id)); } catch(e){ console.error(e); }
}

// ── Realtime sync ─────────────────────────────────────────────────
function startRealtime(){
  realtimeUnsubs.forEach(u=>u()); realtimeUnsubs=[];
  realtimeUnsubs=[
    onSnapshot(userRef(),snap=>{
      if(!snap.exists()) return;
      const d=snap.data();
      DATA.labels=d.labels||DATA.labels;
      DATA.settings={...DATA.settings,...(d.settings||{})};
      applyBg(); applyCSSVars(); renderTagBar(); renderAll();
    }),
    onSnapshot(linksRef(),snap=>{
      DATA.links=[];
      snap.forEach(d=>DATA.links.push(d.data()));
      DATA.links.sort((a,b)=>(a.order||0)-(b.order||0));
      renderAll();
    })
  ];
}

// ── Background ────────────────────────────────────────────────────
const bgLayer=document.getElementById('bg-layer');
let randTimer=null;
function applyBg(){
  const s=DATA.settings;
  clearInterval(randTimer);
  bgLayer.className=''; bgLayer.style.background=''; bgLayer.style.backgroundImage='';
  if(s.bgType==='solid'){
    bgLayer.style.background=s.bgColor;
    document.documentElement.style.setProperty('--bg',s.bgColor);
  } else if(s.bgType==='gradient'){
    bgLayer.style.background=s.gradDir==='radial'
      ?`radial-gradient(ellipse at center,${s.gradC1},${s.gradC2})`
      :`linear-gradient(${s.gradDir},${s.gradC1},${s.gradC2})`;
  } else if(s.bgType==='image'){
    bgLayer.className='has-image'; bgLayer.style.backgroundImage=`url('${s.bgImgUrl}')`;
  } else if(s.bgType==='random'&&s.randomImages&&s.randomImages.length){
    setRandBg();
    if(s.randInterval>0) randTimer=setInterval(setRandBg,s.randInterval*1000);
  }
}
function setRandBg(){
  const imgs=DATA.settings.randomImages; if(!imgs||!imgs.length) return;
  bgLayer.className='has-image';
  bgLayer.style.backgroundImage=`url('${imgs[Math.floor(Math.random()*imgs.length)]}')`;
}

// ── Grid / Pages ──────────────────────────────────────────────────
const pagesEl=document.getElementById('pages-container');
const dotsEl=document.getElementById('page-dots');
let curPage=0, curFilter='all', pages=[];

function filteredLinks(){ return curFilter==='all'?[...DATA.links]:DATA.links.filter(l=>(l.labels||[]).includes(curFilter)); }
function capacity(){
  const s=DATA.settings;
  const cols=Math.floor((pagesEl.clientWidth+s.gap)/(s.cardW+s.gap));
  const rows=Math.floor((pagesEl.clientHeight+s.gap)/(s.cardH+s.gap));
  return Math.max(1,cols*rows);
}
function applyCSSVars(){
  const s=DATA.settings;
  document.documentElement.style.setProperty('--card-w',s.cardW+'px');
  document.documentElement.style.setProperty('--card-h',s.cardH+'px');
  document.documentElement.style.setProperty('--gap',s.gap+'px');
  document.documentElement.style.setProperty('--accent',s.accent);
  document.documentElement.style.setProperty('--accent-dim',hexToRgba(s.accent,.15));
}
function renderAll(){
  const links=filteredLinks(), cap=capacity();
  const chunks=[];
  for(let i=0;i<links.length;i+=cap) chunks.push(links.slice(i,i+cap));
  if(!chunks.length) chunks.push([]);
  pages=chunks;
  if(curPage>=chunks.length) curPage=Math.max(0,chunks.length-1);
  pagesEl.innerHTML='';
  chunks.forEach((chunk,pi)=>{
    const div=document.createElement('div');
    div.className='page'+(pi===curPage?' active':'');
    div.dataset.page=pi;
    chunk.forEach(l=>div.appendChild(makeCard(l)));
    if(pi===chunks.length-1) div.appendChild(makeAddCard());
    pagesEl.appendChild(div);
  });
  renderDots(); applyCSSVars();
}
function renderDots(){
  dotsEl.innerHTML='';
  pages.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===curPage?' active':'');
    d.addEventListener('click',()=>goPage(i));
    dotsEl.appendChild(d);
  });
}
function goPage(n){
  if(n<0||n>=pages.length) return;
  pagesEl.querySelector('.page.active')?.classList.remove('active');
  curPage=n;
  pagesEl.querySelector(`.page[data-page="${n}"]`)?.classList.add('active');
  renderDots();
}

// ── Cards ─────────────────────────────────────────────────────────
function makeCard(link){
  const div=document.createElement('a');
  div.className='link-card'; div.dataset.id=link.id; div.draggable=true;
  div.href=link.url; div.target='_blank'; div.rel='noreferrer noopener';

  // Clic gauche → même onglet
  div.addEventListener('click', e => {
    if(dragMoved){ e.preventDefault(); return; }
    e.preventDefault();
    window.location.href = link.url;
  });

  // Clic droit → menu contextuel
  div.addEventListener('contextmenu', e=>{ e.preventDefault(); showCtx(e,link.id); });

  // Drag
  div.addEventListener('dragstart', onDragStart);
  div.addEventListener('dragover',  onDragOver);
  div.addEventListener('dragleave', onDragLeave);
  div.addEventListener('drop',      onDrop);
  div.addEventListener('dragend',   onDragEnd);

  // Icône
  const wrap=document.createElement('div'); wrap.className='icon-wrap';
  if(link.icon&&isEmoji(link.icon)){
    const fb=document.createElement('div'); fb.className='fallback-icon'; fb.textContent=link.icon.trim(); wrap.appendChild(fb);
  } else {
    const img=document.createElement('img'); img.src=link.icon||faviconUrl(link.url); img.alt=link.name;
    img.onerror=()=>{ const fb=document.createElement('div'); fb.className='fallback-icon'; fb.textContent=(link.name||'?')[0].toUpperCase(); img.replaceWith(fb); };
    wrap.appendChild(img);
  }

  // Nom
  const name=document.createElement('div'); name.className='card-name'; name.textContent=link.name||link.url;

  div.appendChild(wrap); div.appendChild(name);
  return div;
}
function makeAddCard(){
  const div=document.createElement('div');
  div.className='add-card';
  div.innerHTML='<div class="icon-wrap">＋</div><div class="card-name">Add</div>';
  div.addEventListener('click',openAddModal);
  return div;
}

// ── Drag & Drop (with slot preview) ──────────────────────────────
let dragId=null, dragMoved=false, dropTargetId=null, dropSide=null;

function clearSlots(){
  document.querySelectorAll('.link-card').forEach(c=>c.classList.remove('drag-before','drag-after','dragging'));
}

function onDragStart(e){
  dragId=e.currentTarget.dataset.id;
  dragMoved=false;
  setTimeout(()=>{
    const el=document.querySelector(`.link-card[data-id="${dragId}"]`);
    if(el) el.classList.add('dragging');
  },0);
  e.dataTransfer.effectAllowed='move';
  // Transparent drag image to let CSS do the work
  const ghost=document.createElement('div');
  ghost.style.cssText='position:fixed;top:-200px;left:-200px;width:60px;height:60px;border-radius:14px;background:var(--accent);opacity:.8;';
  document.body.appendChild(ghost);
  e.dataTransfer.setDragImage(ghost,30,30);
  setTimeout(()=>ghost.remove(),0);
}

function onDragOver(e){
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const card=e.currentTarget;
  if(!card.dataset.id||card.dataset.id===dragId) return;
  dragMoved=true;
  clearSlots();
  const el=document.querySelector(`.link-card[data-id="${dragId}"]`);
  if(el) el.classList.add('dragging');
  // Determine insertion side
  const rect=card.getBoundingClientRect();
  const side=e.clientX<rect.left+rect.width/2?'before':'after';
  card.classList.add(side==='before'?'drag-before':'drag-after');
  dropTargetId=card.dataset.id; dropSide=side;
}

function onDragLeave(e){
  const card=e.currentTarget;
  // Only clear if truly leaving the card (not entering a child)
  if(!card.contains(e.relatedTarget)){
    card.classList.remove('drag-before','drag-after');
    if(dropTargetId===card.dataset.id){ dropTargetId=null; dropSide=null; }
  }
}

function onDrop(e){
  e.preventDefault();
  if(!dropTargetId||dropTargetId===dragId){ clearSlots(); return; }
  const si=DATA.links.findIndex(l=>l.id===dragId);
  let ti=DATA.links.findIndex(l=>l.id===dropTargetId);
  if(si<0||ti<0){ clearSlots(); return; }
  const [item]=DATA.links.splice(si,1);
  // Recalculate target after removal
  ti=DATA.links.findIndex(l=>l.id===dropTargetId);
  DATA.links.splice(dropSide==='after'?ti+1:ti,0,item);
  scheduleSave(); clearSlots(); renderAll();
  dropTargetId=null; dropSide=null;
}

function onDragEnd(){
  clearSlots(); dragId=null; dropTargetId=null; dropSide=null;
  setTimeout(()=>dragMoved=false,10);
}

// ── Context Menu (Edit + Delete only) ────────────────────────────
const ctxEl=document.getElementById('ctx-menu');
let ctxId=null;
function showCtx(e,id){
  ctxId=id;
  ctxEl.style.left=Math.min(e.clientX,window.innerWidth-170)+'px';
  ctxEl.style.top=Math.min(e.clientY,window.innerHeight-90)+'px';
  ctxEl.classList.add('show');
}
function hideCtx(){ ctxEl.classList.remove('show'); ctxId=null; }

document.getElementById('ctx-edit').addEventListener('click',()=>{ openEditModal(ctxId); hideCtx(); });
document.getElementById('ctx-delete').addEventListener('click',async()=>{
  const id=ctxId; hideCtx();
  await removeLink(id);
  DATA.links=DATA.links.filter(l=>l.id!==id);
  scheduleSave(); renderAll(); showToast('Link deleted','success');
});
document.addEventListener('click',e=>{ if(!ctxEl.contains(e.target)) hideCtx(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ hideCtx(); closeModal(); closeSettings(); }
  // Enter to submit modal
  if(e.key==='Enter'&&modalEl.classList.contains('show')){ e.preventDefault(); doSave(); }
});

// ── Modal ─────────────────────────────────────────────────────────
const modalEl=document.getElementById('modal-overlay');
const mName=document.getElementById('m-name'), mUrl=document.getElementById('m-url'),
      mIcon=document.getElementById('m-icon'), mTagsEl=document.getElementById('m-tags');
let editId=null;

function renderModalTags(sel=[]){
  mTagsEl.innerHTML='';
  // Sort alphabetically, LOCKED_TAG always last
  const sorted = [...DATA.labels].sort((a,b)=>{
    if(a===LOCKED_TAG) return 1;
    if(b===LOCKED_TAG) return -1;
    return a.localeCompare(b);
  });
  sorted.forEach(lbl=>{
    const c=document.createElement('div'); c.className='tchip'+(sel.includes(lbl)?' sel':''); c.textContent=lbl;
    c.addEventListener('click',()=>c.classList.toggle('sel'));
    mTagsEl.appendChild(c);
  });
}
function openAddModal(){
  editId=null; document.getElementById('modal-title').textContent='Add link';
  mName.value=mUrl.value=mIcon.value='';
  renderModalTags([]); modalEl.classList.add('show'); mName.focus();
}
function openEditModal(id){
  editId=id; const l=DATA.links.find(x=>x.id===id); if(!l) return;
  document.getElementById('modal-title').textContent='Edit link';
  mName.value=l.name; mUrl.value=l.url; mIcon.value=l.icon||'';
  renderModalTags(l.labels||[]); modalEl.classList.add('show'); mName.focus();
}
function closeModal(){ modalEl.classList.remove('show'); editId=null; }
function doSave(){
  const url=mUrl.value.trim(); if(!url){ mUrl.style.borderColor='#ff4444'; return; } mUrl.style.borderColor='';
  const sel=[...mTagsEl.querySelectorAll('.tchip.sel')].map(c=>c.textContent);
  if(editId){ const l=DATA.links.find(x=>x.id===editId); if(l){l.name=mName.value.trim()||url;l.url=url;l.icon=mIcon.value.trim();l.labels=sel;} }
  else DATA.links.push({id:uid(),name:mName.value.trim()||url,url,icon:mIcon.value.trim(),labels:sel,order:DATA.links.length});
  scheduleSave(); renderAll(); closeModal(); showToast(editId?'Updated ✓':'Added ✓','success');
}
document.getElementById('m-cancel').addEventListener('click',closeModal);
document.getElementById('m-save').addEventListener('click',doSave);
modalEl.addEventListener('click',e=>{ if(e.target===modalEl) closeModal(); });

// ── PIN state ─────────────────────────────────────────────────────
const LOCKED_TAG = '🔒 confidential';
let pinUnlocked = false;

function askPin(){
  if(pinUnlocked) return true;
  const stored = DATA.settings.pin;
  if(!stored){
    const p1 = prompt('Set a 4-digit PIN for 🔒 tag:');
    if(!p1||!/^\d{4}$/.test(p1)){ alert('PIN must be exactly 4 digits.'); return false; }
    const p2 = prompt('Confirm PIN:');
    if(p1!==p2){ alert('PINs do not match.'); return false; }
    DATA.settings.pin = p1; scheduleSave();
  } else {
    const entered = prompt('Enter PIN to access 🔒:');
    if(entered!==stored){ alert('Wrong PIN.'); return false; }
  }
  pinUnlocked = true;
  return true;
}

// ── Tags bar ──────────────────────────────────────────────────────
function renderTagBar(){
  const bar=document.getElementById('label-bar'); bar.innerHTML='';

  const all=document.createElement('div');
  all.className='label-chip'+(curFilter==='all'?' active':''); all.textContent='All';
  all.addEventListener('click',()=>{ curFilter='all'; curPage=0; renderTagBar(); renderAll(); });
  bar.appendChild(all);

  // Sort alphabetically, excluding LOCKED_TAG (handled by lock button)
  const sortedLabels = [...DATA.labels]
    .filter(l => l !== LOCKED_TAG)
    .sort((a,b) => a.localeCompare(b));

  sortedLabels.forEach(lbl=>{
    const chip=document.createElement('div');
    chip.className='label-chip'+(curFilter===lbl?' active':''); chip.textContent=lbl;
    chip.addEventListener('click',e=>{
      if(e.target.classList.contains('lbl-del')) return;
      if(lbl===LOCKED_TAG && !askPin()) return;
      curFilter=lbl; curPage=0; renderTagBar(); renderAll();
    });
    const del=document.createElement('div'); del.className='lbl-del'; del.textContent='×'; del.title='Remove tag';
    del.addEventListener('click',e=>{
      e.stopPropagation();
      DATA.labels=DATA.labels.filter(l=>l!==lbl);
      DATA.links.forEach(l=>{l.labels=(l.labels||[]).filter(x=>x!==lbl)});
      if(curFilter===lbl) curFilter='all';
      scheduleSave(); renderTagBar(); renderAll();
    });
    chip.appendChild(del); bar.appendChild(chip);
  });

  // Add 🔒 tag button if not yet created
  if(!DATA.labels.includes(LOCKED_TAG)){
    const lockBtn=document.createElement('div');
    lockBtn.className='label-chip'; lockBtn.textContent='+ 🔒';
    lockBtn.style.cssText='opacity:.4;font-size:11px;';
    lockBtn.addEventListener('click',()=>{
      if(!askPin()) return;
      DATA.labels.push(LOCKED_TAG); scheduleSave(); renderTagBar();
    });
    bar.appendChild(lockBtn);
  }

  const addBtn=document.createElement('button'); addBtn.id='lbl-add-btn'; addBtn.textContent='+ tag';
  addBtn.addEventListener('click',()=>{
    const n=(prompt('New tag name:')||'').trim().toLowerCase();
    if(!n||DATA.labels.includes(n)) return;
    DATA.labels.push(n); scheduleSave(); renderTagBar();
  });
  bar.appendChild(addBtn);
}

// ── Settings ──────────────────────────────────────────────────────
const settingsEl=document.getElementById('settings-panel');
function openSettings(){ syncSettingsUI(); settingsEl.classList.add('show'); }
function closeSettings(){ settingsEl.classList.remove('show'); }
document.getElementById('btn-settings').addEventListener('click',openSettings);
document.getElementById('s-close').addEventListener('click',closeSettings);
settingsEl.addEventListener('click',e=>{ if(e.target===settingsEl) closeSettings(); });

function syncSettingsUI(){
  const s=DATA.settings;
  document.getElementById('bg-color').value=s.bgColor;
  document.getElementById('grad-c1').value=s.gradC1;
  document.getElementById('grad-c2').value=s.gradC2;
  document.getElementById('grad-dir').value=s.gradDir;
  document.getElementById('bg-img-url').value=s.bgImgUrl||'';
  document.getElementById('rand-interval').value=s.randInterval||0;
  ['card-w','card-h','gap'].forEach(k=>{
    const map={'card-w':'cardW','card-h':'cardH','gap':'gap'};
    document.getElementById('s-'+k).value=s[map[k]];
    document.getElementById('s-'+k+'-val').textContent=s[map[k]]+'px';
  });
  document.getElementById('accent-color').value=s.accent;
  document.querySelectorAll('.bg-opt').forEach(o=>o.classList.toggle('active',o.dataset.bg===s.bgType));
  showBgOpts(s.bgType); renderRandList();
  document.getElementById('firebase-uid-display').textContent=userId||'…';
}
function showBgOpts(t){
  ['solid','gradient','image','random'].forEach(x=>document.getElementById('bg-'+x+'-opts').style.display=t===x?'':'none');
}
function saveSetting(k,v){ DATA.settings[k]=v; scheduleSave(); }

document.querySelectorAll('.bg-opt').forEach(o=>o.addEventListener('click',()=>{
  document.querySelectorAll('.bg-opt').forEach(x=>x.classList.remove('active')); o.classList.add('active');
  saveSetting('bgType',o.dataset.bg); showBgOpts(o.dataset.bg); applyBg();
}));
document.getElementById('bg-color').addEventListener('input',e=>{ saveSetting('bgColor',e.target.value); applyBg(); });
document.getElementById('grad-c1').addEventListener('input',e=>{ saveSetting('gradC1',e.target.value); applyBg(); });
document.getElementById('grad-c2').addEventListener('input',e=>{ saveSetting('gradC2',e.target.value); applyBg(); });
document.getElementById('grad-dir').addEventListener('change',e=>{ saveSetting('gradDir',e.target.value); applyBg(); });
document.getElementById('bg-img-apply').addEventListener('click',()=>{ saveSetting('bgImgUrl',document.getElementById('bg-img-url').value.trim()); applyBg(); });
document.getElementById('rand-img-add').addEventListener('click',()=>{
  const url=document.getElementById('rand-img-url').value.trim(); if(!url) return;
  if(!DATA.settings.randomImages) DATA.settings.randomImages=[];
  DATA.settings.randomImages.push(url); document.getElementById('rand-img-url').value='';
  scheduleSave(); renderRandList(); applyBg();
});
document.getElementById('rand-interval').addEventListener('change',e=>{ saveSetting('randInterval',parseInt(e.target.value)||0); applyBg(); });

function renderRandList(){
  const list=document.getElementById('random-images-list'); list.innerHTML='';
  (DATA.settings.randomImages||[]).forEach((url,i)=>{
    const row=document.createElement('div'); row.className='rand-img-item';
    row.innerHTML=`<span title="${url}">${url}</span><button>✕</button>`;
    row.querySelector('button').addEventListener('click',()=>{ DATA.settings.randomImages.splice(i,1); scheduleSave(); renderRandList(); applyBg(); });
    list.appendChild(row);
  });
}
['card-w','card-h','gap'].forEach(k=>{
  const el=document.getElementById('s-'+k), vl=document.getElementById('s-'+k+'-val');
  const map={'card-w':'cardW','card-h':'cardH','gap':'gap'};
  el.addEventListener('input',()=>{ const v=parseInt(el.value); vl.textContent=v+'px'; saveSetting(map[k],v); renderAll(); });
});
document.getElementById('accent-color').addEventListener('input',e=>{ saveSetting('accent',e.target.value); applyCSSVars(); });

// ── Navigation (keyboard, wheel, touch) ──────────────────────────
document.getElementById('btn-add-link').addEventListener('click',openAddModal);

document.addEventListener('keydown',e=>{
  if(modalEl.classList.contains('show')||settingsEl.classList.contains('show')) return;
  if(e.key==='ArrowRight') goPage(curPage+1);
  if(e.key==='ArrowLeft')  goPage(curPage-1);
});
let txS=0;
document.addEventListener('touchstart',e=>{ txS=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-txS; if(Math.abs(dx)>50) goPage(curPage+(dx<0?1:-1)); },{passive:true});
let wcd=false;
document.addEventListener('wheel',e=>{
  if(modalEl.classList.contains('show')||settingsEl.classList.contains('show')) return;
  if(wcd) return; wcd=true; goPage(curPage+(e.deltaY>0||e.deltaX>0?1:-1)); setTimeout(()=>wcd=false,600);
},{passive:true});
window.addEventListener('resize',renderAll);

// ── Auth helpers ──────────────────────────────────────────────────
const provider = new GoogleAuthProvider();
const ADMIN_EMAIL = window.ADMIN_EMAIL || '';

async function isAdmin(user){
  return user.email === ADMIN_EMAIL ||
    (await getDoc(doc(db,'admins',user.uid))).exists();
}

async function isApproved(user){
  if(await isAdmin(user)) return true;
  const snap = await getDoc(doc(db,'users',user.uid));
  return snap.exists() && snap.data().approved === true;
}

async function consumeInvite(token, user){
  const ref = doc(db,'invites',token);
  const snap = await getDoc(ref);
  if(!snap.exists()) return false;
  const d = snap.data();
  if(d.used) return false;
  if(d.expiresAt && d.expiresAt.toMillis() < Date.now()) return false;
  // Mark used
  await setDoc(ref, {...d, used:true, usedBy:user.uid, usedAt:serverTimestamp()});
  // Approve user
  await setDoc(doc(db,'users',user.uid), {
    approved: true, email: user.email,
    displayName: user.displayName, createdAt: serverTimestamp()
  }, {merge:true});
  return true;
}

// ── Login screen ──────────────────────────────────────────────────
function showLoginScreen(msg=''){
  const splash = document.getElementById('splash');
  splash.innerHTML = `
    <div class="splash-logo">⬡ startpage</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:320px;">
      ${msg ? `<div style="font-size:12px;color:#ff6060;text-align:center;">${msg}</div>` : ''}
      <button id="btn-google-signin" style="
        display:flex;align-items:center;gap:10px;
        background:#fff;color:#222;border:none;border-radius:12px;
        padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;
        font-family:var(--font);width:100%;justify-content:center;
        box-shadow:0 2px 12px rgba(0,0,0,0.4);transition:opacity .15s;">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.2 30.2 0 24 0 14.7 0 6.7 5.4 2.9 13.3l7.9 6.1C12.6 13.2 17.9 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.5 2.9-2.2 5.4-4.7 7l7.3 5.7c4.3-4 6.8-9.9 7.2-16.7z"/><path fill="#FBBC05" d="M10.8 28.6A14.7 14.7 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.3-6.2z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.3-5.7c-2 1.4-4.6 2.2-7.9 2.2-6.1 0-11.3-3.7-13.2-9l-8.3 6.2C6.7 42.6 14.7 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div style="font-size:11px;color:var(--text-muted);text-align:center;line-height:1.6;">
        Access is by invitation only.<br>If you have an invitation token, sign in first.
      </div>
      <div style="display:flex;gap:8px;width:100%;">
        <input id="invite-token-input" type="text" placeholder="Invitation token (optional)"
          style="flex:1;border-radius:10px;padding:10px 14px;background:rgba(255,255,255,.07);
          border:1px solid rgba(255,255,255,.15);color:var(--text);font-family:var(--font);
          font-size:13px;outline:none;">
      </div>
    </div>`;

  document.getElementById('btn-google-signin').addEventListener('click', async ()=>{
    const token = (document.getElementById('invite-token-input').value||'').trim();
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      // Check approval
      if(await isApproved(user)){
        bootApp(user); return;
      }
      // Try token
      if(token){
        const ok = await consumeInvite(token, user);
        if(ok){ bootApp(user); return; }
        showLoginScreen('❌ Invalid or expired token.');
        await signOut(auth); return;
      }
      showLoginScreen('⛔ Access restricted. You need an invitation token.');
      await signOut(auth);
    } catch(e){
      console.error(e);
      showLoginScreen('⚠ Sign-in failed. Try again.');
    }
  });
}

// ── Admin panel ───────────────────────────────────────────────────
async function showAdminPanel(){
  const panel = document.createElement('div');
  panel.id = 'admin-panel';
  panel.style.cssText = `position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;`;

  panel.innerHTML = `
    <div style="background:rgba(16,16,16,.98);border:1px solid rgba(255,255,255,.1);
      border-radius:24px;padding:28px;width:520px;max-height:80vh;overflow-y:auto;
      display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(0,0,0,.7);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 style="font-size:16px;font-weight:500;">👑 Admin panel</h2>
        <div id="admin-close" style="cursor:pointer;color:rgba(255,255,255,.4);font-size:20px;">✕</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);">Generate invitation</div>
        <div style="display:flex;gap:8px;">
          <select id="inv-expiry" style="border-radius:10px;padding:9px 12px;background:#1e1e1e;
            border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.88);font-family:inherit;font-size:13px;outline:none;flex:1;">
            <option value="24">Expires in 24h</option>
            <option value="72">Expires in 72h</option>
            <option value="168">Expires in 7 days</option>
            <option value="0">No expiry</option>
          </select>
          <button id="btn-gen-invite" style="background:var(--accent);color:#000;border:none;
            border-radius:10px;padding:9px 18px;font-family:inherit;font-size:13px;
            font-weight:500;cursor:pointer;">Generate</button>
        </div>
        <div id="invite-result" style="font-size:12px;color:var(--accent);word-break:break-all;
          background:rgba(200,255,0,.07);border-radius:8px;padding:10px 12px;display:none;"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);">Users</div>
        <div id="admin-users-list" style="display:flex;flex-direction:column;gap:6px;font-size:13px;">
          <div style="color:rgba(255,255,255,.3);">Loading…</div>
        </div>
      </div>
    </div>`;

  document.body.appendChild(panel);
  panel.querySelector('#admin-close').addEventListener('click',()=>panel.remove());
  panel.addEventListener('click',e=>{ if(e.target===panel) panel.remove(); });

  // Load users
  const usersSnap = await getDocs(collection(db,'users'));
  const listEl = panel.querySelector('#admin-users-list');
  listEl.innerHTML = '';
  usersSnap.forEach(d=>{
    const u = d.data();
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;';
    row.innerHTML = `
      <div style="flex:1;">
        <div style="color:rgba(255,255,255,.88);">${u.displayName||'—'}</div>
        <div style="color:rgba(255,255,255,.4);font-size:11px;">${u.email||d.id}</div>
      </div>
      <div style="font-size:11px;padding:3px 8px;border-radius:6px;
        background:${u.approved?'rgba(200,255,0,.12)':'rgba(255,60,60,.12)'};
        color:${u.approved?'var(--accent)':'#ff6060'};">
        ${u.approved?'approved':'pending'}
      </div>
      ${u.approved?`<button data-uid="${d.id}" class="btn-revoke" style="background:none;border:1px solid rgba(255,60,60,.4);color:#ff6060;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;">Revoke</button>`:''}`;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('.btn-revoke').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const uid = btn.dataset.uid;
      await setDoc(doc(db,'users',uid),{approved:false},{merge:true});
      showToast('User revoked','success'); panel.remove(); showAdminPanel();
    });
  });

  // Generate invite
  panel.querySelector('#btn-gen-invite').addEventListener('click', async ()=>{
    const hours = parseInt(panel.querySelector('#inv-expiry').value);
    const token = Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
    const data = { used:false, createdAt:serverTimestamp(),
      expiresAt: hours>0 ? new Date(Date.now()+hours*3600000) : null };
    await setDoc(doc(db,'invites',token), data);
    const resEl = panel.querySelector('#invite-result');
    resEl.style.display='block';
    resEl.innerHTML = `Token: <strong>${token}</strong><br>
      <span style="opacity:.6;font-size:11px;">Share this token with the user — valid ${hours>0?hours+'h':'forever'}</span>`;
  });
}

// ── App boot ──────────────────────────────────────────────────────
async function bootApp(user){
  userId = user.uid;
  const splash = document.getElementById('splash');
  if(splash){ splash.querySelector('.splash-status') && (splash.querySelector('.splash-status').textContent='Loading data…'); }
  await loadData();
  applyBg(); applyCSSVars(); renderTagBar(); renderAll();
  startRealtime();
  if(splash){ splash.classList.add('hidden'); setTimeout(()=>splash.remove(),500); }

  // Add sign-out + admin buttons to settings
  const sClose = document.getElementById('s-close');
  if(sClose && !document.getElementById('btn-signout')){
    const row = document.createElement('div');
    row.style.cssText='display:flex;gap:10px;align-items:center;justify-content:space-between;';
    row.innerHTML=`
      <div style="font-size:12px;color:rgba(255,255,255,.4);">
        ${user.displayName||user.email}
      </div>
      <div style="display:flex;gap:8px;">
        ${await isAdmin(user)?'<button id="btn-admin" class="btn btn-ghost" style="font-size:12px;padding:7px 14px;">👑 Admin</button>':''}
        <button id="btn-signout" class="btn btn-ghost" style="font-size:12px;padding:7px 14px;">Sign out</button>
      </div>`;
    sClose.parentNode.insertBefore(row, sClose.parentNode.firstChild);
    document.getElementById('btn-signout').addEventListener('click', async ()=>{
      await signOut(auth); location.reload();
    });
    const adminBtn = document.getElementById('btn-admin');
    if(adminBtn) adminBtn.addEventListener('click',()=>{ closeSettings(); showAdminPanel(); });
  }

  showToast(`Welcome ${user.displayName||user.email} 👋`,'success');

  document.getElementById('label-bar').classList.add('hidden');
  document.getElementById('btn-toggle-tags').addEventListener('click', () => {
    const bar = document.getElementById('label-bar');
    const btn = document.getElementById('btn-toggle-tags');
    bar.classList.toggle('hidden');
    btn.classList.toggle('active');
    btn.textContent = bar.classList.contains('hidden') ? '⊟' : '⊞';
  });
}

// ── Boot entry point ──────────────────────────────────────────────
onAuthStateChanged(auth, async user=>{
  if(user){
    if(await isApproved(user)){ bootApp(user); }
    else { showLoginScreen('⛔ Your account is pending approval.'); await signOut(auth); }
  } else {
    showLoginScreen();
  }
});
</script>
